<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1" />
    <title>The Last Frequency | a night in eight hours</title>
    <meta name="description" content="The Last Frequency — an original offline visual novel. Runs 100% from the local filesystem: no server, no CDN, no runtime fetches. Story, UI and characters are original; only the Monogatari engine code is borrowed." />

    <!-- 100% LOCAL dependencies (relative paths -> double-click to run) -->
    <link rel="stylesheet" href="vendor/monogatari.css" />
    <!-- Offline icon shim (maps fa-* classes to Unicode glyphs; no font CDN).
         Must come AFTER monogatari.css. -->
    <link rel="stylesheet" href="vendor/icons-offline.css" />

    <style>
        /* ============================================================
           THE LAST FREQUENCY — "midnight broadcast" theme (original).
           Ink-navy sea-dark ground, vacuum-tube amber accents, ivory
           serif dialogue, a live waveform in the header and an
           in-story clock HUD. Distinct from any example game's look.
           ============================================================ */
        :root {
            --ink:      #0b1020;
            --ink-2:    #121a30;
            --panel:    rgba(11, 16, 32, 0.86);
            --amber:    #e0a85a;
            --amber-2:  #f2c879;
            --amber-dim:#9c7a45;
            --ivory:    #efe7d6;
            --mist:     #aab4c8;
            --line:     rgba(224, 168, 90, 0.30);
            --sea:      #1b3a4a;
            --hud-h:    52px;
            --serif:    Georgia, 'Iowan Old Style', 'Times New Roman', serif;
            --sans:     'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --mono:     'SFMono-Regular', 'Cascadia Code', 'Consolas', monospace;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }

        body {
            background:
                radial-gradient(120% 80% at 50% -10%, #16213f 0%, var(--ink) 55%, #070a14 100%);
            color: var(--ivory);
            font-family: var(--sans);
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* faint drifting "static" grain over everything (pure CSS, no fetch) */
        .grain {
            position: fixed; inset: 0; pointer-events: none; z-index: 9000; opacity: 0.05;
            background-image:
                repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 3px);
            mix-blend-mode: overlay;
            animation: grain 7s steps(6) infinite;
        }
        @keyframes grain { 0%{transform:translateY(0)} 50%{transform:translateY(-2px)} 100%{transform:translateY(1px)} }
        .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 8999;
            box-shadow: inset 0 0 220px 40px rgba(0,0,0,.75); }

        /* ---- top HUD ---- */
        .topbar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--hud-h);
            display: flex; align-items: center; gap: 14px; padding: 0 16px;
            background: linear-gradient(180deg, rgba(7,10,20,.96), rgba(7,10,20,.72));
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(8px); z-index: 600;
        }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand .title { font-family: var(--serif); font-style: italic; letter-spacing: .5px;
            font-size: .92rem; color: var(--amber-2); white-space: nowrap; }
        .brand .sub { font-family: var(--mono); font-size: .58rem; letter-spacing: 2px;
            color: var(--amber-dim); text-transform: uppercase; }
        /* live waveform */
        .wave { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
        .wave i { width: 2px; background: var(--amber); border-radius: 2px; opacity: .85;
            animation: wv 1.1s ease-in-out infinite; }
        .wave i:nth-child(1){height:40%;animation-delay:0s}
        .wave i:nth-child(2){height:80%;animation-delay:.12s}
        .wave i:nth-child(3){height:55%;animation-delay:.24s}
        .wave i:nth-child(4){height:100%;animation-delay:.36s}
        .wave i:nth-child(5){height:35%;animation-delay:.48s}
        .wave i:nth-child(6){height:70%;animation-delay:.6s}
        .wave i:nth-child(7){height:50%;animation-delay:.72s}
        @keyframes wv { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }

        .hud-mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; min-width: 0; }
        .clock { font-family: var(--mono); font-size: 1.15rem; letter-spacing: 2px; color: var(--amber-2);
            text-shadow: 0 0 14px rgba(224,168,90,.5); padding: 2px 10px; border: 1px solid var(--line);
            border-radius: 5px; background: rgba(0,0,0,.35); white-space: nowrap; }
        .loc { font-family: var(--mono); font-size: .66rem; letter-spacing: 1.5px; color: var(--mist);
            text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 38vw; }

        .hud-right { display: flex; align-items: center; gap: 14px; }
        .storm { display: flex; align-items: center; gap: 7px; font-family: var(--mono);
            font-size: .62rem; letter-spacing: 1px; color: var(--mist); white-space: nowrap; }
        .storm .dot { width: 9px; height: 9px; border-radius: 50%; background: #445; box-shadow: 0 0 8px currentColor; }
        .storm.s1 .dot{background:#5a7;color:#5a7} .storm.s2 .dot{background:#cb8;color:#cb8}
        .storm.s3 .dot{background:#e0a85a;color:#e0a85a;animation:pulse 1.4s infinite} .storm.s4 .dot{background:#778;color:#778}
        .storm.s5 .dot{background:#f2c879;color:#f2c879}
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        .signal { display: flex; align-items: center; gap: 6px; }
        .signal .lab { font-family: var(--mono); font-size: .56rem; letter-spacing: 1px; color: var(--amber-dim); }
        .signal .bars { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
        .signal .bar { width: 4px; background: #2a3350; border-radius: 1px; }
        .signal .bar:nth-child(1){height:6px} .signal .bar:nth-child(2){height:10px} .signal .bar:nth-child(3){height:15px}
        .signal .bar.on { background: var(--amber); box-shadow: 0 0 6px var(--amber); }

        .hud-btn { font-family: var(--mono); font-size: .64rem; letter-spacing: 1px; color: var(--amber-2);
            background: rgba(224,168,90,.08); border: 1px solid var(--line); border-radius: 5px;
            padding: 6px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            transition: background .18s, color .18s, box-shadow .18s; }
        .hud-btn:hover { background: var(--amber); color: #1a1206; box-shadow: 0 0 14px rgba(224,168,90,.5); }
        .hud-btn .count { color: var(--amber-dim); }
        .hud-btn:hover .count { color: #1a1206; }

        @media (max-width: 860px) { .brand .sub, .loc, .storm span, .signal .lab { display: none; } .clock { font-size: 1rem; } }

        /* ---- monogatari container ---- */
        #vn-root { position: absolute; top: var(--hud-h); left: 0; right: 0; bottom: 0; }
        #vn-root > visual-novel { height: 100%; }
        visual-novel, main-screen, game-screen, text-box, main-menu, quick-menu, dialog-log,
        save-screen, load-screen, settings-screen, help-screen, gallery-screen, credits-screen {
            font-family: var(--serif) !important;
        }

        /* ---- title screen ---- */
        main-screen {
            background:
                linear-gradient(180deg, rgba(7,10,20,.55) 0%, rgba(7,10,20,.35) 40%, rgba(7,10,20,.92) 100%),
                url('assets/scenes/title_exterior.jpg') center/cover no-repeat !important;
        }
        main-screen::before {
            content: 'The Last Frequency';
            position: absolute; top: 17%; left: 0; right: 0; text-align: center;
            font-family: var(--serif); font-style: italic; font-weight: 400;
            font-size: clamp(2.2rem, 7vw, 4.6rem); color: var(--ivory);
            text-shadow: 0 2px 30px rgba(0,0,0,.8), 0 0 26px rgba(224,168,90,.35);
            letter-spacing: 1px; pointer-events: none; z-index: 3;
        }
        main-screen::after {
            content: 'a night in eight hours';
            position: absolute; top: calc(17% + clamp(2.6rem, 8vw, 5.2rem)); left: 0; right: 0; text-align: center;
            font-family: var(--mono); font-size: clamp(.62rem, 1.5vw, .9rem); letter-spacing: 6px;
            text-transform: uppercase; color: var(--amber); pointer-events: none; z-index: 3;
        }
        main-menu {
            position: absolute !important; inset: 0 !important; display: flex !important;
            flex-direction: column !important; align-items: center !important; justify-content: center !important;
            gap: 4px !important; padding-top: 22vh !important; background: transparent !important;
        }
        main-menu button {
            font-family: var(--sans) !important; letter-spacing: 3px !important; text-transform: uppercase !important;
            font-size: .82rem !important; font-weight: 600 !important;
            width: 240px !important; padding: 12px 0 !important; margin: 5px 0 !important;
            color: var(--ivory) !important; background: rgba(11,16,32,.55) !important;
            border: 1px solid var(--line) !important; border-radius: 3px !important;
            cursor: pointer; transition: all .25s ease; backdrop-filter: blur(3px);
        }
        main-menu button:hover {
            background: var(--amber) !important; color: #15100a !important;
            border-color: var(--amber) !important; box-shadow: 0 0 22px rgba(224,168,90,.45) !important;
            letter-spacing: 4px !important;
        }

        /* ---- dialogue box ---- */
        text-box {
            background: var(--panel) !important; border: 1px solid var(--line) !important;
            border-left: 4px solid var(--amber) !important; border-radius: 6px !important;
            box-shadow: 0 18px 50px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04) !important;
            margin: 14px !important; padding: 20px 26px 22px !important; min-height: 168px !important;
            max-width: calc(100% - 28px) !important; backdrop-filter: blur(10px) !important;
        }
        text-box [data-content="character-name"] {
            font-family: var(--sans) !important; font-weight: 700 !important; font-size: .82rem !important;
            letter-spacing: 2px !important; text-transform: uppercase !important;
            color: var(--amber-2) !important; background: rgba(0,0,0,.4) !important;
            border: 1px solid var(--line) !important; border-radius: 3px !important;
            padding: 3px 12px !important; display: inline-block !important; margin-bottom: 10px !important;
        }
        text-box [data-content="character-name"]:empty { display: none !important; }  /* narrator has no nameplate */
        text-box [data-content="dialog"] {
            font-family: var(--serif) !important; font-size: 1.18rem !important; line-height: 1.7 !important;
            color: var(--ivory) !important;
        }

        /* ---- choices ---- */
        choice-container {
            position: absolute !important; left: 50% !important; transform: translateX(-50%) !important;
            top: 8% !important; bottom: 210px !important; width: min(92%, 760px) !important;
            height: auto !important; max-height: none !important; margin: 0 !important; padding: 8px !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            overflow-y: auto; z-index: 20;
        }
        choice-container [data-content="wrapper"] {
            display: flex !important; flex-direction: column !important; align-items: center !important;
            width: 100% !important;
        }
        choice-container button {
            font-family: var(--serif) !important; font-size: 1rem !important; line-height: 1.45 !important;
            text-align: center !important; width: 100% !important; height: auto !important;
            color: var(--ivory) !important; background: rgba(11,16,32,.92) !important;
            border: 1px solid var(--amber-dim) !important; border-radius: 4px !important;
            padding: 13px 20px !important; margin: 7px auto !important; cursor: pointer !important;
            transition: all .2s ease; box-shadow: 0 8px 24px rgba(0,0,0,.5); backdrop-filter: blur(5px);
        }
        choice-container button:hover {
            background: rgba(224,168,90,.16) !important; border-color: var(--amber) !important;
            color: var(--amber-2) !important; box-shadow: 0 0 20px rgba(224,168,90,.3); transform: translateY(-1px);
        }

        /* ---- quick menu ---- */
        quick-menu {
            background: rgba(7,10,20,.8) !important; border: 1px solid var(--line) !important;
            border-radius: 22px !important; padding: 2px 12px !important; margin-bottom: 8px !important;
            backdrop-filter: blur(8px) !important;
        }
        quick-menu button {
            color: var(--mist) !important; font-family: var(--sans) !important; font-size: .68rem !important;
            letter-spacing: 1px !important; padding: 6px 9px !important; cursor: pointer !important;
            transition: color .2s, text-shadow .2s !important;
        }
        quick-menu button:hover { color: var(--amber-2) !important; text-shadow: 0 0 8px rgba(224,168,90,.6) !important; }

        /* ---- character + vision staging ---- */
        [data-screen="game"] [data-character] {
            filter: drop-shadow(0 14px 26px rgba(0,0,0,.7));
            max-height: calc(100% - 150px) !important; bottom: 150px !important;
        }
        /* the luminous "signal made visible" vision (Ending C epilogue) */
        [data-screen="game"] img[src*="elara_hopeful"] {
            filter: drop-shadow(0 0 26px rgba(224,168,90,.75)) brightness(1.06); opacity: .97;
        }

        /* ---- shared modal chrome ---- */
        .lf-modal {
            position: fixed; inset: 0; background: rgba(5,8,16,.86); backdrop-filter: blur(9px);
            z-index: 1200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .25s ease;
        }
        .lf-modal.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: linear-gradient(180deg, var(--ink-2), var(--ink));
            border: 1px solid var(--line); border-radius: 8px; width: 92%; max-width: 620px;
            max-height: 82vh; overflow-y: auto; padding: 22px 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,.7);
        }
        .modal-head { display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 6px; }
        .modal-head h3 { margin: 0; font-family: var(--serif); font-style: italic; font-weight: 400;
            font-size: 1.25rem; color: var(--amber-2); }
        .modal-head .count { font-family: var(--mono); font-size: .66rem; color: var(--amber-dim); letter-spacing: 1px; }
        .modal-x { background: none; border: none; color: var(--mist); font-size: 1.5rem; cursor: pointer; line-height: 1; }
        .modal-x:hover { color: var(--amber-2); }
        .codex-hint { font-family: var(--serif); font-style: italic; color: var(--mist); font-size: .92rem; margin: 8px 0 16px; }

        .codex-row { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0;
            border-bottom: 1px solid rgba(224,168,90,.12); }
        .codex-row:last-child { border-bottom: none; }
        .codex-portrait { width: 64px; height: 86px; object-fit: cover; object-position: top; border-radius: 4px;
            border: 1px solid var(--line); background: #0c1224; flex: 0 0 auto; }
        .codex-portrait.dial {
            background: radial-gradient(circle at 50% 45%, rgba(224,168,90,.5), rgba(224,168,90,.05) 60%, transparent 70%), #0c1224;
            border-color: var(--amber-dim);
        }
        .codex-text h4 { margin: 0 0 5px; font-family: var(--sans); font-size: .82rem; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--amber-2); }
        .codex-text p { margin: 0; font-family: var(--serif); font-size: .98rem; line-height: 1.6; color: var(--ivory); }
        .codex-locked { font-family: var(--mono) !important; font-style: normal !important; font-size: .74rem !important;
            color: var(--amber-dim) !important; letter-spacing: .5px; }
        .codex-row.locked { opacity: .55; }
        .codex-row.locked .codex-portrait { filter: grayscale(1) brightness(.5); }

        /* ---- settings / save / load / help screens: warm them up ---- */
        settings-screen, save-screen, load-screen, help-screen { background: rgba(7,10,20,.92) !important; }
        .t-amber { color: var(--amber-2); font-weight: 700; }
        .t-emerald { color: #7fc6a0; font-weight: 700; }
        .t-rose { color: #d98a8a; font-weight: 700; }
        .t-violet { color: #b9a6e0; font-weight: 700; }
        .t-big { font-size: 1.08em; }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="vignette"></div>

    <!-- ================= TOP HUD ================= -->
    <header class="topbar">
        <div class="brand">
            <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span><span class="title">Meridian Point</span><br><span class="sub">relay station · 1420 kHz</span></span>
        </div>
        <div class="hud-mid">
            <span class="clock" id="hud-clock">22:00</span>
            <span class="loc" id="hud-location">MERIDIAN POINT — SEA ROAD</span>
        </div>
        <div class="hud-right">
            <span class="storm s1" id="hud-storm"><span class="dot"></span><span>STORM I — leading edge</span></span>
            <span class="signal" title="Signal clarity"><span class="lab">SIG</span><span class="bars"><span class="bar"></span><span class="bar"></span><span class="bar"></span></span></span>
            <button type="button" class="hud-btn" id="btn-watchlog"><i class="fas fa-book"></i> WATCH LOG <span class="count" id="codex-count">2/6</span></button>
        </div>
    </header>

    <!-- ================= MONOGATARI =================
         Container id is "vn-root", never "monogatari" (a div with
         id="monogatari" creates window.monogatari and breaks the engine). -->
    <div id="vn-root">
        <visual-novel>
            <language-selection-screen></language-selection-screen>
            <loading-screen></loading-screen>
            <main-screen><main-menu></main-menu></main-screen>
            <game-screen>
                <dialog-log></dialog-log>
                <text-box></text-box>
                <quick-menu></quick-menu>
            </game-screen>
            <gallery-screen></gallery-screen>
            <credits-screen></credits-screen>
            <load-screen></load-screen>
            <save-screen></save-screen>
            <settings-screen></settings-screen>
            <help-screen></help-screen>
        </visual-novel>
    </div>

    <!-- ================= WATCH-LOG CODEX ================= -->
    <div id="watchlog-modal" class="lf-modal">
        <div class="modal-card">
            <div class="modal-head">
                <h3>The Watch Log</h3>
                <span><span class="count" id="codex-count2"></span> <button type="button" class="modal-x" data-close="watchlog-modal">&times;</button></span>
            </div>
            <p class="codex-hint">Notes recovered from the station, unlocked as the night reveals them.</p>
            <div id="codex-list"></div>
        </div>
    </div>

    <!-- Engine code borrowed from the Cyber-Nexus example (Monogatari engine,
         FailSafe rollback facade, offline icon shim) -->
    <script src="vendor/failsafe.js"></script>
    <script src="vendor/monogatari.js"></script>
    <script src="vendor/icons-offline.js"></script>
    <!-- Original story data + original game glue (loaded after the engine) -->
    <script src="vendor/story.js"></script>
    <script src="vendor/game.js"></script>
</body>
</html>
