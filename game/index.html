    <!-- SHELL HEADER — live HUD over the scene (location, resources, actions,
         7-segment clock). Values are written by updateHUD() in vendor/game.js
         into the [data-hud-text] slots; visible only while the game screen is
         active (vendor/aurora-ui.js toggles html.aurora-playing). -->
    <header class="shell-header" id="shell-header" aria-label="Статус смены">
        <div class="header-main">
            <div class="location">
                <svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg>
                <div>
                    <h1 id="hud-location" class="outlined"><span data-hud-text>Тэцуба: Улица</span></h1>
                    <p class="eyebrow outlined"><span id="hud-route" data-hud-text>Начало</span></p>
                </div>
            </div>
            <div class="hud">
                <div class="resources" aria-label="Ресурсы">
                    <button type="button" class="resource" id="hud-money" title="Деньги — открыть архив" data-open-archives>
                        <svg class="icon" aria-hidden="true"><use href="#i-coins"></use></svg><span class="outlined" data-hud-text>1000</span>
                    </button>
                    <button type="button" class="resource" id="hud-items" title="Предметы — открыть архив" data-open-archives>
                        <svg class="icon" aria-hidden="true"><use href="#i-box"></use></svg><span class="outlined" data-hud-text>0</span>
                    </button>
                    <button type="button" class="resource" id="hud-alert-level" title="Тревога Акатоми — открыть архив" data-open-archives>
                        <span class="alert-dot" aria-hidden="true"></span><span class="outlined" data-hud-text>0%</span>
                    </button>
                </div>
                <div class="header-actions">
                    <button type="button" class="button icon-button" id="btn-skip" aria-pressed="false" title="Быстрая перемотка текста">
                        <i class="fas fa-fast-forward" hidden></i>
                        <svg class="icon" aria-hidden="true"><use href="#i-skip"></use></svg>
                        <span class="sr-only">Перемотка</span>
                    </button>
                    <button type="button" class="button icon-button" id="btn-archives" title="Архив Сэйрин">
                        <svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>
                        <span class="sr-only">Архив</span>
                    </button>
                    <button type="button" class="button icon-button" id="btn-mute" aria-pressed="false" title="Звук">
                        <svg class="icon icon-sound" aria-hidden="true"><use href="#i-volume"></use></svg>
                        <svg class="icon icon-muted" aria-hidden="true"><use href="#i-muted"></use></svg>
                        <span class="sr-only">Звук</span>
                    </button>
                    <button type="button" class="button icon-button" id="btn-menu" title="Меню игры" aria-haspopup="dialog" aria-expanded="false">
                        <svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg>
                        <span class="sr-only">Меню игры</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="clock" role="timer" aria-label="Дата и время">
            <time id="hud-time" class="outlined">21<span class="hud-clock-colon">:</span>00</time>
            <time id="hud-date" class="outlined">15.07.2026</time>
        </div>
    </header>

    <!-- MONOGATARI CONTAINER — engine markup skeleton.
         NOTE 1: the container id is "vn-root", NOT "monogatari" (an element
         with id="monogatari" creates a global window.monogatari pointing at
         the DIV, which shadows the engine object).
         NOTE 2: the engine renders INTO these custom elements but never
         creates them. game/ used to ship an empty <div id="vn-root">, so
         engine.init() aborted and the player got a white screen instead of
         the main menu (cyber-nexus/index.html is the reference). -->
    <div id="vn-root">
        <visual-novel>
            <language-selection-screen></language-selection-screen>
            <loading-screen></loading-screen>
            <main-screen>
                <!-- The title card is part of the skin's static markup. The
                     mockup used CSS to place and style it; it is not created
                     on every engine mutation by the skin driver. -->
                <div class="aurora-title" aria-labelledby="title-heading">
                    <p class="eyebrow">Визуальная новелла · Ночная смена</p>
                    <h1 id="title-heading">Сэйрин</h1>
                    <p class="small">Резонанс 2030. Одна ночь в Тэцубе — и развилка, после которой город уже не будет прежним.</p>
                </div>
                <main-menu></main-menu>
            </main-screen>
            <game-screen>
                <dialog-log></dialog-log>
                <text-box></text-box>
                <quick-menu></quick-menu>
            </game-screen>
            <gallery-screen></gallery-screen>
            <credits-screen></credits-screen>
            <load-screen></load-screen>
            <save-screen></save-screen>
            <settings-screen></settings-screen>
            <help-screen></help-screen>
        </visual-novel>
    </div>

    <!-- SHELL FOOTER — glass rail under the dialogue box. The engine's own
         <quick-menu> is pinned over the middle cell by vendor/aurora-ui.css;
         the two side cells are ours. -->
    <footer class="shell-footer" id="shell-footer" aria-label="Панель управления">
        <div class="footer-status">
            <svg class="icon" aria-hidden="true"><use href="#i-user"></use></svg>
            <span id="hud-player-name" data-hud-text>Рэн</span>
        </div>
        <div class="footer-center" aria-hidden="true"></div>
        <div class="footer-status footer-status--right">
            <span id="hud-status">Город ещё не спит.</span>
        </div>
    </footer>

    <!-- IN-GAME MENU (opened by #btn-menu in the header; wired in
         vendor/aurora-ui.js). Its buttons only forward to the engine's own
         actions, so it never touches story state. -->
    <div id="game-menu-overlay" class="aurora-overlay" hidden>
        <div class="panel menu-panel" role="dialog" aria-modal="true" aria-labelledby="game-menu-title">
            <div class="panel-header">
                <div>
                    <p class="eyebrow">Ночная смена</p>
                    <h2 id="game-menu-title">Меню игры</h2>
                </div>
                <button type="button" class="button icon-button" id="btn-game-menu-close" title="Закрыть">
                    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
                    <span class="sr-only">Закрыть</span>
                </button>
            </div>
            <div class="menu-list">
                <button type="button" class="button primary" data-menu="resume"><svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>Вернуться в ночь</button>
                <button type="button" class="button" data-menu="save"><svg class="icon" aria-hidden="true"><use href="#i-save"></use></svg>Сохранить</button>
                <button type="button" class="button" data-menu="load"><svg class="icon" aria-hidden="true"><use href="#i-load"></use></svg>Загрузить</button>
                <button type="button" class="button" data-menu="log"><svg class="icon" aria-hidden="true"><use href="#i-history"></use></svg>История реплик</button>
                <button type="button" class="button" data-menu="archives"><svg class="icon" aria-hidden="true"><use href="#i-book"></use></svg>Архив Сэйрин</button>
                <div class="menu-divider" role="separator"></div>
                <button type="button" class="button" data-menu="settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>Настройки</button>
                <button type="button" class="button" data-menu="help"><svg class="icon" aria-hidden="true"><use href="#i-help"></use></svg>Помощь</button>
                <button type="button" class="button" data-menu="quit"><svg class="icon" aria-hidden="true"><use href="#i-power"></use></svg>Выйти в главное меню</button>
            </div>
        </div>
    </div>

    <!-- ARCHIVES CODEX MODAL (opened by #btn-archives, wired in vendor/game.js) -->
    <div id="archives-overlay" class="archives-overlay" hidden>
        <div class="archives-panel panel" role="dialog" aria-modal="true" aria-labelledby="archives-title">
            <div class="archives-head panel-header">
                <div>
                    <p class="eyebrow">Кодекс</p>
                    <h2 id="archives-title"><i class="fas fa-book" hidden></i><span>Архив Сэйрин</span></h2>
                </div>
                <button type="button" class="button icon-button" id="btn-archives-close" title="Закрыть">
                    <i class="fas fa-times" hidden></i>
                    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
                    <span class="sr-only">Закрыть</span>
                </button>
            </div>
            <div id="archives-body" class="archives-body"></div>
        </div>
    </div>

    <!-- ROUTE GRAPH DEBUG MODAL (opened from the main menu, wired in
         vendor/game.js). The graph itself is generated at runtime from
         engine.script(), so the map can never drift out of sync with the
         shipped story. -->
    <div id="graph-overlay" class="graph-overlay" hidden>
        <div class="graph-panel panel" role="dialog" aria-modal="true" aria-labelledby="graph-title">
            <div class="graph-head panel-header">
                <div>
                    <p class="eyebrow">Отладка</p>
                    <h2 id="graph-title"><i class="fas fa-network-wired" hidden></i><span>Граф маршрутов</span></h2>
                </div>
                <button type="button" class="button icon-button" id="btn-graph-close" title="Закрыть">
                    <i class="fas fa-times" hidden></i>
                    <svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg>
                    <span class="sr-only">Закрыть</span>
                </button>
            </div>
            <div id="graph-body" class="graph-body"></div>
        </div>
    </div>
