<svg xmlns="http://www.w3.org/2000/svg" width="520" height="530" viewBox="0 0 520 530" role="img" aria-label="Nyan, the neighbours' calico bobtail cat, sitting and looking at the city">
 <!-- Original vector prop for the balcony easter egg (vendor/story/nyan.js).
      Backlit calico bobtail against the city glow: dark fur, cyan rim light,
      amber eyes that blink (SMIL runs inside an <img>, so no JS or CSS is
      needed). No railing in the sprite: custom-ui.css lifts the whole sprite
      so the paws land on the cg_balcony railing. Hand-written, like
      radio_signal.svg — not a cast member, so it has no cast.json entry. -->
 <defs>
  <linearGradient id="fur" x2="0" y2="1"><stop stop-color="#243044"/><stop offset=".55" stop-color="#121a28"/><stop offset="1" stop-color="#070b14"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#fbbf24" stop-opacity=".16"/><stop offset=".6" stop-color="#fbbf24" stop-opacity=".05"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
 </defs>

 <!-- warm halo so the dark cat separates from any backdrop -->
 <ellipse cx="250" cy="300" rx="210" ry="240" fill="url(#halo)"/>
 <!-- contact shadow -->
 <ellipse cx="256" cy="508" rx="150" ry="12" fill="#000" opacity=".55" filter="url(#soft)"/>

 <!-- cyan rim light: same silhouette, nudged up-left, drawn under the body -->
 <g fill="#7dd3fc" opacity=".85" transform="translate(-5 -6)">
  <path d="M178 194L158 96L246 166Z"/>
  <path d="M256 166L332 90L322 194Z"/>
  <ellipse cx="250" cy="236" rx="84" ry="76"/>
  <path d="M196 286C148 330 116 400 120 500H374C380 410 360 340 306 288Z"/>
  <circle cx="392" cy="472" r="31"/>
 </g>

 <!-- tail pompom (Japanese bobtail) -->
 <circle cx="392" cy="472" r="31" fill="url(#fur)"/>
 <circle cx="398" cy="466" r="16" fill="#b4632a" opacity=".28"/>

 <!-- body -->
 <path d="M196 286C148 330 116 400 120 500H374C380 410 360 340 306 288Z" fill="url(#fur)"/>
 <!-- calico: white chest, ginger shoulder, dark back -->
 <ellipse cx="240" cy="400" rx="44" ry="78" fill="#dbe4ee" opacity=".13"/>
 <path d="M300 300C340 330 356 380 362 440C340 420 310 380 292 330Z" fill="#b4632a" opacity=".3"/>
 <path d="M130 470C128 420 140 370 165 330C150 380 146 430 150 490Z" fill="#000" opacity=".28"/>
 <!-- front legs and paws -->
 <rect x="207" y="392" width="34" height="112" rx="16" fill="#0c121c"/>
 <rect x="253" y="392" width="34" height="112" rx="16" fill="#0c121c"/>
 <ellipse cx="224" cy="500" rx="22" ry="10" fill="#111927"/>
 <ellipse cx="270" cy="500" rx="22" ry="10" fill="#111927"/>
 <path d="M208 494h32M254 494h32" stroke="#7dd3fc" stroke-width="1.5" opacity=".35"/>

 <!-- head -->
 <path d="M178 194L158 96L246 166Z" fill="url(#fur)"/>
 <path d="M256 166L332 90L322 194Z" fill="url(#fur)"/>
 <path d="M186 184L172 120L236 172Z" fill="#3a2630" opacity=".75"/>
 <path d="M262 172L320 112L312 184Z" fill="#3a2630" opacity=".75"/>
 <ellipse cx="250" cy="236" rx="84" ry="76" fill="url(#fur)"/>
 <path d="M172 210C180 170 200 160 222 168C206 190 196 210 190 250Z" fill="#b4632a" opacity=".32"/>
 <ellipse cx="250" cy="270" rx="46" ry="30" fill="#dbe4ee" opacity=".1"/>
 <!-- cheek tufts -->
 <path d="M168 250l-18 8 16 6-14 10 18 2" fill="none" stroke="#0e1522" stroke-width="6" stroke-linejoin="round"/>
 <path d="M332 250l18 8-16 6 14 10-18 2" fill="none" stroke="#0e1522" stroke-width="6" stroke-linejoin="round"/>

 <!-- eyes: amber, vertical pupils, soft glow -->
 <g filter="url(#glow)" opacity=".7">
  <ellipse cx="218" cy="244" rx="20" ry="13" fill="#fbbf24"/>
  <ellipse cx="282" cy="244" rx="20" ry="13" fill="#fbbf24"/>
 </g>
 <ellipse cx="218" cy="244" rx="17" ry="11" fill="#fcd34d"/>
 <ellipse cx="282" cy="244" rx="17" ry="11" fill="#fcd34d"/>
 <ellipse cx="218" cy="244" rx="4" ry="10" fill="#0b0a06"/>
 <ellipse cx="282" cy="244" rx="4" ry="10" fill="#0b0a06"/>
 <circle cx="212" cy="239" r="2.5" fill="#fff8dc" opacity=".9"/>
 <circle cx="276" cy="239" r="2.5" fill="#fff8dc" opacity=".9"/>
 <!-- eyelids: closed for ~0.25s every 6s (a cat blink, nothing else moves) -->
 <g fill="#151d2b">
  <ellipse cx="218" cy="244" rx="21" ry="0">
   <animate attributeName="ry" values="0;0;14;14;0;0" keyTimes="0;0.9;0.92;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="282" cy="244" rx="21" ry="0">
   <animate attributeName="ry" values="0;0;14;14;0;0" keyTimes="0;0.9;0.92;0.95;0.97;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
 </g>

 <!-- nose, mouth, whiskers -->
 <path d="M243 268h14l-7 8Z" fill="#d9a3ab" opacity=".8"/>
 <path d="M250 276v8M250 284q-8 8-16 2M250 284q8 8 16 2" fill="none" stroke="#1c2433" stroke-width="2.5" stroke-linecap="round"/>
 <g stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" opacity=".38" fill="none">
  <path d="M232 276Q180 266 138 262"/><path d="M232 282Q182 284 136 290"/><path d="M234 288Q188 302 146 318"/>
  <path d="M268 276Q320 266 362 262"/><path d="M268 282Q318 284 364 290"/><path d="M266 288Q312 302 354 318"/>
 </g>
</svg>
