<!DOCTYPE html>
<!-- ============================================================================
     Seirin — MECHA-UI visual harness (DEV ONLY, not shipped with the game)
     ----------------------------------------------------------------------------
     Renders the real vendor/mecha-ui.css against hand-written markup that
     mirrors what the Monogatari engine produces at runtime, so the armour skin
     can be reviewed without booting the whole VN. Open by double-clicking.
     The game itself never loads this file.
     ========================================================================= -->
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seirin — Mecha UI preview</title>
<link rel="stylesheet" href="../../game/assets/fonts/fonts.css" />
<link rel="stylesheet" href="../../game/vendor/monogatari.css" />
<link rel="stylesheet" href="../../game/vendor/icons-offline.css" />
<link rel="stylesheet" href="../../game/vendor/custom-ui.css" />
<link rel="stylesheet" href="../../game/vendor/mecha-ui.css" />
<style>
  /* Harness-only scaffolding: fakes the engine's screen geometry. */
  html, body { height: 100%; margin: 0; background: #05070c; }
  .stage {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background:
      linear-gradient(rgba(8,10,18,.62), rgba(6,8,14,.88)),
      url('../../game/assets/scenes/courtyard.png') center/cover no-repeat;
    font-family: 'Rajdhani', system-ui, sans-serif;
  }
  .stage[data-screen="game"] { display: block; }
  choice-container { display: block; }
  choice-container [data-content="wrapper"] { display: flex; flex-direction: column; }
  text-box { display: grid; }
</style>
</head>
<body>
<div class="stage" data-screen="game">

  <header class="cyber-top-hud">
    <div class="hud-group">
      <span class="hud-brand"><i class="fas fa-microchip"></i> СЭЙРИН РЕЗОНАНС 2030</span>
      <span id="hud-location" class="hud-badge"><i class="fas fa-map-marker-alt"></i><span>Тэцуба: Улица</span></span>
    </div>
    <div class="hud-group">
      <span id="hud-player-name" class="hud-badge amber"><i class="fas fa-user-secret"></i><span>Рэн</span></span>
      <span id="hud-route" class="hud-badge pink"><i class="fas fa-terminal"></i><span>Мия</span></span>
      <span id="hud-alert-level" class="hud-badge red"><i class="fas fa-shield-alt"></i><span>45%</span></span>
    </div>
    <div class="hud-group">
      <button type="button" class="hud-btn active" id="btn-skip"><i class="fas fa-fast-forward"></i><span>ПЕРЕМОТКА</span></button>
      <button type="button" class="hud-btn" id="btn-archives"><i class="fas fa-book"></i><span>АРХИВ</span></button>
    </div>
  </header>

  <choice-container style="top:44%">
    <div data-content="wrapper">
      <button data-choice="a">Подняться к Мие и помочь с ритуалом дружбы</button>
      <button data-choice="b">Отправиться в Aquaforge к Сплеш и Стелле</button>
      <button data-choice="c">Остановиться и подумать о природе реальности</button>
    </div>
  </choice-container>

  <text-box>
    <div data-content="name"><span data-ui="who" data-content="character-name">Мия Кагэцуки</span></div>
    <div data-content="side-image"></div>
    <div data-content="text">
      <p data-ui="say" data-content="dialog">Сегодня Обряд Дружбы! Поможешь мне? Резонанс держится, но Акатоми уже слушает город — надо решать быстро.</p>
    </div>
  </text-box>

  <quick-menu data-component="quick-menu">
    <button><span class="fas fa-arrow-left"></span><span data-string>Назад</span></button>
    <button><span class="fas fa-save"></span><span data-string>Сохранить</span></button>
    <button><span class="fas fa-cog"></span><span data-string>Настройки</span></button>
  </quick-menu>
</div>

<script src="../../game/vendor/mecha-ui.js"></script>
<script>
  // Fake just enough engine surface for the instrument rail to have data.
  window.engine = { storage: function () {
    return { akatomi_alert: 45, miya_affinity: 10, momo_affinity: 0,
             ai_empathy: 3, philosophical_depth: 6, route: 'miya' };
  } };
  if (window.MechaUI) { window.MechaUI.refresh(); }
</script>
</body>
</html>
